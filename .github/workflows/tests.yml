name: tests

# The suite at both ends of the supported range (README "Supported versions").
# The checks under docs/extraction/ read the source repositories and run locally only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: low
            python: "3.12.15"
            ray: "2.43.0"
            sqlalchemy: "2.0.39"
          - name: high
            python: "3.13.16"
            ray: "2.55.1"
            sqlalchemy: "2.0.46"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package, editable, with the pins
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "ray==${{ matrix.ray }}" "sqlalchemy==${{ matrix.sqlalchemy }}"

      - name: Versions
        run: |
          python -c "import sys, sqlite3, ray, sqlalchemy; print('python', sys.version); print('ray', ray.__version__); print('sqlalchemy', sqlalchemy.__version__); print('sqlite', sqlite3.sqlite_version)"

      - name: The suite
        run: python -m unittest discover -s datastorekit/tests -t .

      - name: black
        if: matrix.name == 'low'
        run: |
          python -m pip install black==25.1.0
          black --check datastorekit docs
